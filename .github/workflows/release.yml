name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic checks
        run: python3 tools/run_checks.py
      # Golden runs that call a model are added once CI model costs and sandboxes are settled.
      - name: Build release
        run: python3 tools/build_release.py "${GITHUB_REF_NAME}"
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "Groundwork ${GITHUB_REF_NAME}" \
            --notes-file "dist/${GITHUB_REF_NAME}/release-notes.md" \
            dist/${GITHUB_REF_NAME}/*.zip dist/${GITHUB_REF_NAME}/SHA256SUMS
