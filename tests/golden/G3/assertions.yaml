# Structural assertions for golden project G3 (mostly non-development work). Never exact text.
schema_version: "1.0"
validator_blockers: 0
allowed_minors:
  - GR-20
min_tasks: 8
max_tasks: 14
phases_required:
  - P0
standard_work:
  - test
  - uat
  - docs
  - handoff
production_change_tasks_min: 0
roles_used_subset_of:
  - developer
  - maintainer
  - admin
  - business_user
  - comms
  - approver
every_task:
  points: 1
  max_hours: 6
  has_visible_result: true
must_wait_on_kinds:
  - review
  - approval
  - availability
  - access
no_external_recipients: true
production_change_tasks_max: 0
standard_work_not_applicable:
  - cutover
  - rollback
non_dev_share_min: 0.8
