# Structural assertions for golden project G8 (cross-org). Never exact text.
schema_version: "1.0"
validator_blockers: 0
allowed_minors:
  - GR-20
min_tasks: 12
max_tasks: 20
phases_required:
  - P0
standard_work:
  - test
  - uat
  - cutover
  - rollback
  - docs
  - handoff
production_change_tasks_min: 1
roles_used_subset_of:
  - developer
  - maintainer
  - admin
  - business_user
  - comms
  - approver
every_task:
  points: 1
  max_hours: 6
  has_visible_result: true
must_wait_on_kinds:
  - review
  - approval
  - availability
  - access
no_external_recipients: true
starting_point: extends_existing
changes_existing_tasks_min: 1
changes_justified: true
